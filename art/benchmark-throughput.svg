<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" fill="none">
  <defs>
    <style>
      .serif { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", ui-serif, Georgia, Cambria, "Times New Roman", serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .kanji-title { font-size: 11px; font-weight: 700; letter-spacing: 0.25em; fill: #94a3b8; text-transform: uppercase; }
      .ink-title { font-size: 17px; font-weight: 800; letter-spacing: 0.05em; fill: #ffffff; }
      .ink-sub { font-size: 12px; font-weight: 500; fill: #7e8b9f; }
      .lbl-main { font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .lbl-meta { font-size: 11px; font-weight: 500; fill: #627288; }
      .val-strata { font-size: 16px; font-weight: 800; fill: #ffffff; }
      .val-pg { font-size: 14px; font-weight: 700; fill: #f87171; }
      .seal-text { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 18px; font-weight: 900; fill: #ffffff; }
      .seal-sub { font-family: "Hiragino Mincho ProN", serif; font-size: 8px; font-weight: 700; fill: #fee2e2; letter-spacing: 0.1em; }
    </style>

    <!-- Traditional Fine Ink Crosshatch Pattern for PostgreSQL -->
    <pattern id="ink-crosshatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="1.8" stroke-opacity="0.75"/>
    </pattern>

    <!-- Subtle Sumi-e Wash Texture -->
    <linearGradient id="sumi-blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Brushstroke Edge Mask / Glow -->
    <filter id="ink-bloom" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas: Deep Charcoal Sumi Ink Surface -->
  <rect x="0" y="0" width="880" height="320" rx="4" fill="#090c13"/>
  
  <!-- Outer Woodblock Border & Inset Fine Line -->
  <rect x="12" y="12" width="856" height="296" rx="2" stroke="#252f44" stroke-width="1.5"/>
  <rect x="16" y="16" width="848" height="288" rx="1" stroke="#161f30" stroke-width="1"/>

  <!-- Traditional Ink Corner Accents (Sumi-e Framing) -->
  <path d="M 12 28 L 28 12 M 12 36 L 36 12" stroke="#3b4861" stroke-width="1"/>
  <path d="M 868 28 L 852 12 M 868 36 L 844 12" stroke="#3b4861" stroke-width="1"/>
  <path d="M 12 292 L 28 308 M 12 284 L 36 308" stroke="#3b4861" stroke-width="1"/>
  <path d="M 868 292 L 852 308 M 868 284 L 844 308" stroke="#3b4861" stroke-width="1"/>

  <!-- Red Vermilion Hanko Seal Stamp (層 = Strata) -->
  <g transform="translate(806, 26)">
    <!-- Distressed Seal Outer Box -->
    <rect x="0" y="0" width="46" height="46" rx="5" fill="#dc2626"/>
    <rect x="2" y="2" width="42" height="42" rx="4" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" fill="none"/>
    <text x="23" y="26" text-anchor="middle" class="seal-text">層</text>
    <text x="23" y="38" text-anchor="middle" class="seal-sub">速攻</text>
  </g>

  <!-- Header Header Text -->
  <text x="36" y="44" class="serif kanji-title">飽和並行性能測定 · CONCURRENCY SATURATION</text>
  <text x="36" y="68" class="serif ink-title">Throughput Saturation: 50 Concurrent Clients (k6)</text>
  <text x="36" y="86" class="sans ink-sub">2,000,000 Records · Port 8001 (Persistent Octane Worker) vs Port 8002 (PostgreSQL GIN Baseline)</text>

  <!-- Horizontal Axis Markers -->
  <line x1="220" y1="105" x2="780" y2="105" stroke="#1e2738" stroke-width="1"/>
  <line x1="220" y1="168" x2="780" y2="168" stroke="#161f30" stroke-dasharray="2 4"/>
  <line x1="220" y1="230" x2="780" y2="230" stroke="#1e2738" stroke-width="1"/>

  <!-- ==================== STRATA BAR ==================== -->
  <g transform="translate(36, 118)">
    <!-- Label -->
    <text x="0" y="22" class="serif lbl-main">Strata Engine</text>
    <text x="0" y="38" class="mono lbl-meta">Octane · Lock-Free .seg</text>

    <!-- Background Track -->
    <rect x="184" y="6" width="500" height="34" rx="2" fill="#131b2b"/>

    <!-- Calligraphic Ink Blade (Solid White / Silver Gradient with Calligraphic Bevel) -->
    <!-- Proportional Width: 490px out of 500px -->
    <path d="M 184 6 L 664 6 L 678 23 L 664 40 L 184 40 Z" fill="url(#sumi-blade)" filter="url(#ink-bloom)"/>
    <!-- Top Highlights & Ink Line -->
    <line x1="184" y1="7" x2="663" y2="7" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="184" y1="39" x2="663" y2="39" stroke="#94a3b8" stroke-width="1"/>

    <!-- Traditional Calligraphic Chop Marks / Speed Lines -->
    <line x1="688" y1="12" x2="700" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="688" y1="23" x2="710" y2="23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="688" y1="34" x2="696" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Value Metric -->
    <text x="724" y="24" class="mono val-strata">1,468 req/s</text>
    <text x="724" y="38" class="mono lbl-meta">19.8 ms p50</text>

    <!-- Seal Stamp Badge (24.7x Speedup) -->
    <g transform="translate(535, 11)">
      <rect x="0" y="0" width="118" height="24" rx="2" fill="#dc2626"/>
      <rect x="2" y="2" width="114" height="20" rx="1" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      <text x="59" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.04em">24.7x HIGHER</text>
    </g>
  </g>

  <!-- ==================== POSTGRESQL BAR ==================== -->
  <g transform="translate(36, 182)">
    <!-- Label -->
    <text x="0" y="20" class="serif lbl-main">PostgreSQL 16</text>
    <text x="0" y="36" class="mono lbl-meta">tsvector + GIN Index</text>

    <!-- Background Track -->
    <rect x="184" y="6" width="500" height="34" rx="2" fill="#131b2b"/>

    <!-- Traditional Woodblock Ink Hatch Bar (59.5 req/s -> 20px) -->
    <rect x="184" y="6" width="22" height="34" rx="2" fill="#991b1b"/>
    <rect x="184" y="6" width="22" height="34" rx="2" fill="url(#ink-crosshatch)"/>
    <rect x="184" y="6" width="22" height="34" rx="2" stroke="#ef4444" stroke-width="1.2" fill="none"/>

    <!-- Value Metric -->
    <text x="218" y="22" class="mono val-pg">59.5 req/s</text>
    <text x="218" y="37" class="mono lbl-meta">497.6 ms p50 · Connection Lock Saturation</text>
  </g>

  <!-- Footer Verification Inscriptions -->
  <line x1="36" y1="265" x2="844" y2="265" stroke="#1e2738" stroke-width="1"/>
  
  <text x="36" y="288" class="serif" font-size="12" fill="#cbd5e1">【検証済】 零誤謬 · 14,742 / 14,742 リクエスト完走 (0.00% エラー率)</text>
  <text x="540" y="288" class="mono" font-size="11" fill="#64748b">Verified on 2M Rows · Galloping 2-Pointer Binary Postings</text>
</svg>
