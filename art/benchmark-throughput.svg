<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" fill="none">
  <defs>
    <style>
      .serif { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", ui-serif, Georgia, serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; fill: #ffffff; }
      .entity { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .metric-strata { font-size: 17px; font-weight: 800; fill: #ffffff; }
      .metric-pg { font-size: 14px; font-weight: 700; fill: #f87171; }
      .hanko { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 18px; font-weight: 900; fill: #ffffff; }
      .hanko-sub { font-family: "Hiragino Mincho ProN", serif; font-size: 8px; font-weight: 700; fill: #fee2e2; }
    </style>

    <pattern id="ink-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="1.8" stroke-opacity="0.8"/>
    </pattern>

    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="bloom" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="880" height="240" rx="4" fill="#090c13"/>
  <rect x="12" y="12" width="856" height="216" rx="2" stroke="#252f44" stroke-width="1.5"/>
  <rect x="16" y="16" width="848" height="208" rx="1" stroke="#161f30" stroke-width="1"/>

  <!-- Traditional Ink Corner Accents -->
  <path d="M 12 28 L 28 12 M 12 36 L 36 12" stroke="#3b4861" stroke-width="1"/>
  <path d="M 868 28 L 852 12 M 868 36 L 844 12" stroke="#3b4861" stroke-width="1"/>
  <path d="M 12 212 L 28 228 M 12 204 L 36 228" stroke="#3b4861" stroke-width="1"/>
  <path d="M 868 212 L 852 228 M 868 204 L 844 228" stroke="#3b4861" stroke-width="1"/>

  <!-- Hanko Seal (層 = Strata) -->
  <g transform="translate(806, 26)">
    <rect x="0" y="0" width="46" height="46" rx="5" fill="#dc2626"/>
    <rect x="2" y="2" width="42" height="42" rx="4" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" fill="none"/>
    <text x="23" y="26" text-anchor="middle" class="hanko">層</text>
    <text x="23" y="38" text-anchor="middle" class="hanko-sub">速攻</text>
  </g>

  <!-- Title: Direct, zero taglines or helper text -->
  <text x="36" y="52" class="serif title">Throughput</text>

  <!-- Axis Grid -->
  <line x1="160" y1="78" x2="780" y2="78" stroke="#1e2738" stroke-width="1"/>
  <line x1="160" y1="142" x2="780" y2="142" stroke="#161f30" stroke-dasharray="2 4"/>
  <line x1="160" y1="202" x2="780" y2="202" stroke="#1e2738" stroke-width="1"/>

  <!-- STRATA -->
  <g transform="translate(36, 92)">
    <text x="0" y="26" class="serif entity">Strata</text>

    <!-- Track -->
    <rect x="124" y="6" width="530" height="32" rx="2" fill="#131b2b"/>

    <!-- Luminous Blade -->
    <path d="M 124 6 L 634 6 L 646 22 L 634 38 L 124 38 Z" fill="url(#blade)" filter="url(#bloom)"/>
    <line x1="124" y1="7" x2="633" y2="7" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Chop Marks -->
    <line x1="656" y1="14" x2="666" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="656" y1="22" x2="674" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="656" y1="30" x2="663" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Value -->
    <text x="692" y="28" class="mono metric-strata">1,468 req/s</text>

    <!-- Speedup Seal -->
    <g transform="translate(520, 10)">
      <rect x="0" y="0" width="100" height="24" rx="2" fill="#dc2626"/>
      <rect x="2" y="2" width="96" height="20" rx="1" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      <text x="50" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.04em">24.7×</text>
    </g>
  </g>

  <!-- POSTGRESQL -->
  <g transform="translate(36, 154)">
    <text x="0" y="25" class="serif entity">PostgreSQL</text>

    <!-- Track -->
    <rect x="124" y="6" width="530" height="32" rx="2" fill="#131b2b"/>

    <!-- Crosshatch Bar -->
    <rect x="124" y="6" width="22" height="32" rx="2" fill="#991b1b"/>
    <rect x="124" y="6" width="22" height="32" rx="2" fill="url(#ink-hatch)"/>
    <rect x="124" y="6" width="22" height="32" rx="2" stroke="#ef4444" stroke-width="1" fill="none"/>

    <!-- Value -->
    <text x="160" y="27" class="mono metric-pg">59.5 req/s</text>
  </g>
</svg>
