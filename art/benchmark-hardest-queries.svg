<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; fill: #ffffff; }
      .sub { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .q-title { font-size: 12.5px; font-weight: 700; fill: #e2e8f0; }
      .q-sub { font-size: 11px; font-weight: 500; fill: #64748b; }
      .val-cyan { font-size: 12px; font-weight: 800; fill: #00f2fe; }
      .val-coral { font-size: 12px; font-weight: 700; fill: #ff4a6e; }
      .badge-text { font-size: 11px; font-weight: 800; fill: #050b14; letter-spacing: 0.03em; }
      .tag { font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.05em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background: Deep Tech Obsidian Canvas -->
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#080d1a"/>
  <rect x="1" y="1" width="878" height="438" rx="11" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Accent Mecha Border Strip -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 320 0 L 340 20 L 868 20 C 874.63 20 880 25.37 880 32 L 880 4 L 880 0 Z" fill="#00f2fe" opacity="0.15"/>
  <line x1="20" y1="20" x2="320" y2="20" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

  <!-- Header -->
  <text x="32" y="50" class="sans title">Stress-Test IR Benchmark: 2,000,000 Dataset</text>
  <text x="32" y="70" class="sans sub">Head-to-Head Latency: PostgreSQL True Relevance Sort (ts_rank) vs Strata BM25 (Block-Max WAND)</text>

  <!-- Legend -->
  <g transform="translate(620, 42)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#00f2fe"/>
    <text x="18" y="12" class="sans" font-size="11" font-weight="700" fill="#f8fafc">Strata (WAND)</text>
    <rect x="120" y="2" width="12" height="12" rx="2" fill="#ff4a6e"/>
    <text x="138" y="12" class="sans" font-size="11" font-weight="700" fill="#94a3b8">PostgreSQL (ts_rank)</text>
  </g>

  <!-- CHALLENGE 1: Combinatorial Stopword Explosion -->
  <g transform="translate(32, 95)">
    <text x="0" y="12" class="sans q-title">1. Combinatorial Stopword Explosion</text>
    <text x="250" y="12" class="mono q-sub">"mechanical keyboard edition" · 100,000+ candidates</text>

    <!-- Postgres Bar: 2025ms (Scaled to 460px max) -->
    <rect x="0" y="22" width="460" height="18" rx="3" fill="#ff4a6e"/>
    <text x="470" y="36" class="mono val-coral">2,025 ms</text>

    <!-- Strata Bar: 74.8ms (Proportional: 74.8 / 2025 * 460 = 17px) -->
    <path d="M 0 44 L 20 44 L 24 53 L 20 62 L 0 62 Z" fill="#00f2fe"/>
    <text x="32" y="58" class="mono val-cyan">74.8 ms</text>

    <!-- Badge -->
    <rect x="730" y="28" width="94" height="24" rx="4" fill="#00f2fe"/>
    <text x="742" y="44" class="sans badge-text">27.1x FASTER</text>
  </g>

  <line x1="32" y1="172" x2="848" y2="172" stroke="#1e293b" stroke-dasharray="2 4"/>

  <!-- CHALLENGE 2: Rare Needle in 2M Rows -->
  <g transform="translate(32, 184)">
    <text x="0" y="12" class="sans q-title">2. Rare Needle in 2 Million Rows</text>
    <text x="250" y="12" class="mono q-sub">"wireless mouse repudiandae" · High-frequency distractors</text>

    <!-- Postgres Bar: 131ms (Normalized scale) -->
    <rect x="0" y="22" width="280" height="18" rx="3" fill="#ff4a6e"/>
    <text x="290" y="36" class="mono val-coral">131.0 ms</text>

    <!-- Strata Bar: 2.84ms -->
    <path d="M 0 44 L 14 44 L 18 53 L 14 62 L 0 62 Z" fill="#00f2fe"/>
    <text x="26" y="58" class="mono val-cyan">2.84 ms</text>

    <!-- Badge -->
    <rect x="730" y="28" width="94" height="24" rx="4" fill="#00f2fe"/>
    <text x="742" y="44" class="sans badge-text">46.1x FASTER</text>
  </g>

  <line x1="32" y1="261" x2="848" y2="261" stroke="#1e293b" stroke-dasharray="2 4"/>

  <!-- CHALLENGE 3: Relational Attribute Filtering -->
  <g transform="translate(32, 273)">
    <text x="0" y="12" class="sans q-title">3. Hybrid Query + Attribute Filtering</text>
    <text x="250" y="12" class="mono q-sub">"ergonomic chair" + status='active' AND price > 500</text>

    <!-- Postgres Bar: 1539ms -->
    <rect x="0" y="22" width="410" height="18" rx="3" fill="#ff4a6e"/>
    <text x="420" y="36" class="mono val-coral">1,539.5 ms</text>

    <!-- Strata Bar: 25.4ms -->
    <path d="M 0 44 L 16 44 L 20 53 L 16 62 L 0 62 Z" fill="#00f2fe"/>
    <text x="28" y="58" class="mono val-cyan">25.4 ms</text>

    <!-- Badge -->
    <rect x="730" y="28" width="94" height="24" rx="4" fill="#00f2fe"/>
    <text x="742" y="44" class="sans badge-text">60.6x FASTER</text>
  </g>

  <line x1="32" y1="350" x2="848" y2="350" stroke="#1e293b" stroke-dasharray="2 4"/>

  <!-- CHALLENGE 4: Deep Top-K Pagination -->
  <g transform="translate(32, 362)">
    <text x="0" y="12" class="sans q-title">4. Deep Top-K Pagination (Offset 100)</text>
    <text x="250" y="12" class="mono q-sub">"wireless keyboard" · limit=50, offset=100 (WAND threshold elevation)</text>

    <!-- Postgres Bar: 1210ms -->
    <rect x="0" y="22" width="360" height="18" rx="3" fill="#ff4a6e"/>
    <text x="370" y="36" class="mono val-coral">1,210.3 ms</text>

    <!-- Strata Bar: 21.7ms -->
    <path d="M 0 44 L 15 44 L 19 53 L 15 62 L 0 62 Z" fill="#00f2fe"/>
    <text x="27" y="58" class="mono val-cyan">21.7 ms</text>

    <!-- Badge -->
    <rect x="730" y="28" width="94" height="24" rx="4" fill="#00f2fe"/>
    <text x="742" y="44" class="sans badge-text">55.9x FASTER</text>
  </g>
</svg>
