<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" fill="none">
  <defs>
    <style>
      .serif { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", ui-serif, Georgia, serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; fill: #ffffff; }
      .q-label { font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
      .val-strata { font-size: 13px; font-weight: 800; fill: #ffffff; }
      .val-pg { font-size: 13px; font-weight: 700; fill: #f87171; }
      .hanko { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 16px; font-weight: 900; fill: #ffffff; }
      .hanko-sub { font-family: "Hiragino Mincho ProN", serif; font-size: 7.5px; font-weight: 700; fill: #fee2e2; }
    </style>

    <pattern id="ink-hatch-red" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="1.8" stroke-opacity="0.8"/>
    </pattern>

    <linearGradient id="blade-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="blade-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="880" height="380" rx="4" fill="#090c13"/>
  <rect x="12" y="12" width="856" height="356" rx="2" stroke="#252f44" stroke-width="1.5"/>
  <rect x="16" y="16" width="848" height="348" rx="1" stroke="#161f30" stroke-width="1"/>

  <!-- Corner Accents -->
  <path d="M 12 28 L 28 12 M 12 36 L 36 12" stroke="#3b4861" stroke-width="1"/>
  <path d="M 868 28 L 852 12 M 868 36 L 844 12" stroke="#3b4861" stroke-width="1"/>
  <path d="M 12 352 L 28 368 M 12 344 L 36 368" stroke="#3b4861" stroke-width="1"/>
  <path d="M 868 352 L 852 368 M 868 344 L 844 368" stroke="#3b4861" stroke-width="1"/>

  <!-- Hanko Seal (極 = Ultimate) -->
  <g transform="translate(806, 26)">
    <rect x="0" y="0" width="46" height="46" rx="5" fill="#dc2626"/>
    <rect x="2" y="2" width="42" height="42" rx="4" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" fill="none"/>
    <text x="23" y="24" text-anchor="middle" class="hanko">極</text>
    <text x="23" y="38" text-anchor="middle" class="hanko-sub">速攻</text>
  </g>

  <!-- Title & Legend -->
  <text x="36" y="52" class="serif title">Ranked Search Latency</text>

  <g transform="translate(560, 40)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#ffffff"/>
    <text x="18" y="12" class="serif" font-size="12" font-weight="700" fill="#f8fafc">Strata</text>
    <rect x="90" y="2" width="12" height="12" rx="2" fill="#991b1b"/>
    <rect x="90" y="2" width="12" height="12" rx="2" fill="url(#ink-hatch-red)"/>
    <rect x="90" y="2" width="12" height="12" rx="2" stroke="#ef4444" stroke-width="1" fill="none"/>
    <text x="108" y="12" class="serif" font-size="12" font-weight="700" fill="#94a3b8">PostgreSQL</text>
  </g>

  <!-- ROW 1 -->
  <g transform="translate(36, 82)">
    <text x="0" y="14" class="mono q-label">"mechanical keyboard edition"</text>

    <!-- Postgres -->
    <rect x="0" y="24" width="460" height="14" rx="2" fill="#991b1b"/>
    <rect x="0" y="24" width="460" height="14" rx="2" fill="url(#ink-hatch-red)"/>
    <rect x="0" y="24" width="460" height="14" rx="2" stroke="#ef4444" stroke-width="1" fill="none"/>
    <text x="470" y="36" class="mono val-pg">2,025 ms</text>

    <!-- Strata -->
    <path d="M 0 44 L 22 44 L 26 51 L 22 58 L 0 58 Z" fill="url(#blade-grad)" filter="url(#blade-glow)"/>
    <text x="36" y="55" class="mono val-strata">75 ms</text>

    <!-- Badge -->
    <g transform="translate(730, 26)">
      <rect x="0" y="0" width="86" height="24" rx="2" fill="#dc2626"/>
      <rect x="2" y="2" width="82" height="20" rx="1" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      <text x="43" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="900" fill="#ffffff">27.1×</text>
    </g>
  </g>

  <!-- ROW 2 -->
  <g transform="translate(36, 154)">
    <text x="0" y="14" class="mono q-label">"wireless mouse repudiandae"</text>

    <rect x="0" y="24" width="280" height="14" rx="2" fill="#991b1b"/>
    <rect x="0" y="24" width="280" height="14" rx="2" fill="url(#ink-hatch-red)"/>
    <rect x="0" y="24" width="280" height="14" rx="2" stroke="#ef4444" stroke-width="1" fill="none"/>
    <text x="290" y="36" class="mono val-pg">131 ms</text>

    <path d="M 0 44 L 14 44 L 18 51 L 14 58 L 0 58 Z" fill="url(#blade-grad)" filter="url(#blade-glow)"/>
    <text x="28" y="55" class="mono val-strata">2.8 ms</text>

    <g transform="translate(730, 26)">
      <rect x="0" y="0" width="86" height="24" rx="2" fill="#dc2626"/>
      <rect x="2" y="2" width="82" height="20" rx="1" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      <text x="43" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="900" fill="#ffffff">46.1×</text>
    </g>
  </g>

  <!-- ROW 3 -->
  <g transform="translate(36, 226)">
    <text x="0" y="14" class="mono q-label">"ergonomic chair" (status = active, price &gt; 500)</text>

    <rect x="0" y="24" width="410" height="14" rx="2" fill="#991b1b"/>
    <rect x="0" y="24" width="410" height="14" rx="2" fill="url(#ink-hatch-red)"/>
    <rect x="0" y="24" width="410" height="14" rx="2" stroke="#ef4444" stroke-width="1" fill="none"/>
    <text x="420" y="36" class="mono val-pg">1,540 ms</text>

    <path d="M 0 44 L 16 44 L 20 51 L 16 58 L 0 58 Z" fill="url(#blade-grad)" filter="url(#blade-glow)"/>
    <text x="30" y="55" class="mono val-strata">25 ms</text>

    <g transform="translate(730, 26)">
      <rect x="0" y="0" width="86" height="24" rx="2" fill="#dc2626"/>
      <rect x="2" y="2" width="82" height="20" rx="1" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      <text x="43" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="900" fill="#ffffff">60.6×</text>
    </g>
  </g>

  <!-- ROW 4 -->
  <g transform="translate(36, 298)">
    <text x="0" y="14" class="mono q-label">"wireless keyboard" (limit = 50, offset = 100)</text>

    <rect x="0" y="24" width="360" height="14" rx="2" fill="#991b1b"/>
    <rect x="0" y="24" width="360" height="14" rx="2" fill="url(#ink-hatch-red)"/>
    <rect x="0" y="24" width="360" height="14" rx="2" stroke="#ef4444" stroke-width="1" fill="none"/>
    <text x="370" y="36" class="mono val-pg">1,210 ms</text>

    <path d="M 0 44 L 15 44 L 19 51 L 15 58 L 0 58 Z" fill="url(#blade-grad)" filter="url(#blade-glow)"/>
    <text x="29" y="55" class="mono val-strata">22 ms</text>

    <g transform="translate(730, 26)">
      <rect x="0" y="0" width="86" height="24" rx="2" fill="#dc2626"/>
      <rect x="2" y="2" width="82" height="20" rx="1" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      <text x="43" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="900" fill="#ffffff">55.9×</text>
    </g>
  </g>
</svg>
