services:
  strata-api:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: strata_fastpath_api
    restart: unless-stopped
    command: ["php", "-S", "0.0.0.0:80", "demo/strata-server.php"]
    environment:
      STRATA_PATH: /app/vendor/orchestra/testbench-core/laravel/storage/strata
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_DATABASE: strata_bench
      DB_USERNAME: zerakjamil
      DB_PASSWORD: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:80"
    volumes:
      - ../vendor/orchestra/testbench-core/laravel/storage/strata:/app/vendor/orchestra/testbench-core/laravel/storage/strata:ro

  postgres-baseline-api:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: strata_postgres_baseline_api
    restart: unless-stopped
    command: ["php", "-S", "0.0.0.0:80", "demo/postgres-server.php"]
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_DATABASE: strata_bench
      DB_USERNAME: zerakjamil
      DB_PASSWORD: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:80"
